<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15161c" />
  <title>Offline · Filester Navigator</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0f13; color: #ececf1;
      font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px; box-sizing: border-box; }
    .card { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 16px 0 6px; }
    p { color: #a0a1b2; margin: 0 0 20px; }
    button { background: #ececf1; color: #15161c; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Filester Navigator needs a connection to reach your files. Check your internet and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
